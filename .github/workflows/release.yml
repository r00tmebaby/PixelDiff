# Builds and tests the solution on Windows. A push to main that changes more than documentation also
# publishes the desktop application and the command line runner as two self contained zips attached to a
# release. The version is one above the highest release, 0.1.<n + 1>, so every release is newer than the
# last; the tag is v<version>. Pull requests are built and tested the same way, and nothing is released.
name: Build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Numbered from the releases rather than the run, so a release made by hand never collides with one made here.
      - name: Number the version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $last = 0
          foreach ($tag in @(gh release list --limit 100 --json tagName --jq '.[].tagName')) {
            if ($tag -match '^v0\.1\.(\d+)$') { $last = [Math]::Max($last, [int] $Matches[1]) }
          }
          "VERSION=0.1.$($last + 1)" >> $env:GITHUB_ENV

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version=${{ env.VERSION }}

      # No extra switches here: the Microsoft.Testing.Platform runner rejects ones it does not know and reports zero tests.
      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish the desktop application
        run: dotnet publish src/PixelDiff.App/PixelDiff.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o publish/PixelDiff-${{ env.VERSION }}-win-x64

      # The two executables differ only by case, PixelDiff.exe and pixeldiff.exe, so each gets its own folder.
      - name: Publish the command line runner
        run: dotnet publish src/PixelDiff.Cli/PixelDiff.Cli.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -o publish/pixeldiff-cli-${{ env.VERSION }}-win-x64

      - name: Check the published executables
        shell: pwsh
        run: |
          if (-not (Test-Path "publish\PixelDiff-$env:VERSION-win-x64\PixelDiff.exe")) {
            throw 'The publish folder lacks PixelDiff.exe.'
          }

          & "publish\pixeldiff-cli-$env:VERSION-win-x64\pixeldiff.exe" help
          if ($LASTEXITCODE -ne 0) { throw 'The published runner did not start.' }

      # The native Skia and HarfBuzz symbols alone add about 100 MB to the desktop application.
      - name: Drop debug symbols
        shell: pwsh
        run: Get-ChildItem publish -Recurse -File -Filter *.pdb | Remove-Item -Force

      - name: Zip
        shell: pwsh
        run: |
          foreach ($name in "PixelDiff-$env:VERSION-win-x64", "pixeldiff-cli-$env:VERSION-win-x64") {
            Compress-Archive -Path "publish\$name" -DestinationPath "$name.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PixelDiff-${{ env.VERSION }}-win-x64
          path: |
            PixelDiff-${{ env.VERSION }}-win-x64.zip
            pixeldiff-cli-${{ env.VERSION }}-win-x64.zip

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding $false
          $files = @()
          $sums = @()
          foreach ($name in "PixelDiff-$env:VERSION-win-x64", "pixeldiff-cli-$env:VERSION-win-x64") {
            $zip = "$name.zip"
            $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            [System.IO.File]::WriteAllText((Join-Path $pwd "$zip.sha256"), "$hash  $zip`n", $utf8)
            $files += $zip, "$zip.sha256"
            $sums += "$hash  $zip"
          }

          $notes = @(
            "Built from $env:GITHUB_SHA.",
            '',
            (git log -1 --pretty=%s),
            '',
            "``PixelDiff-$env:VERSION-win-x64.zip`` is the desktop application and ``pixeldiff-cli-$env:VERSION-win-x64.zip`` is the command line runner. Both are self contained builds for 64 bit Windows, so no .NET installation is needed. Extract each zip into its own folder. The builds are not code signed, so Windows may ask for confirmation the first time you start them.",
            '',
            'SHA-256:',
            '',
            '```',
            ($sums -join "`n"),
            '```'
          ) -join "`n"
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          [System.IO.File]::WriteAllText($notesFile, $notes, $utf8)

          gh release create "v$env:VERSION" @files --target $env:GITHUB_SHA --title "PixelDiff $env:VERSION" --notes-file $notesFile --latest
          if ($LASTEXITCODE -ne 0) { throw 'Creating the release failed.' }
